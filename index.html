<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج حجز المواعيد - عيادتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-container { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #1e3a8a; text-align: center; margin-bottom: 25px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #4b5563; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #d1d5db; border-radius: 8px; outline: none; font-size: 15px; transition: 0.3s; }
        input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .btn-submit { width: 100%; padding: 14px; background: #3b82f6; border: none; color: white; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #2563eb; }
        .alert { display: none; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: center; font-weight: 600; }
        .alert-success { background-color: #d1fae5; color: #065f46; display: none; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; display: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>حجز موعد جديد</h2>
    
    <div id="alertSuccess" class="alert alert-success">تم إرسال طلب الحجز بنجاح! في انتظار تأكيد الطبيب.</div>
    <div id="alertDanger" class="alert alert-danger">نعتذر، هذا اليوم يعتبر إجازة رسمية للعيادة أو الموعد مغلق.</div>

    <form id="bookingForm">
        <div class="form-group">
            <label for="fullName">الاسم بالكامل</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" required>
        </div>
        
        <div class="form-group">
            <label for="phoneNumber">رقم الهاتف</label>
            <input type="tel" id="phoneNumber" placeholder="01xxxxxxxxx" required>
        </div>
        
        <div class="form-group">
            <label for="appointmentDate">تاريخ الحجز</label>
            <input type="date" id="appointmentDate" required>
        </div>
        
        <div class="form-group">
            <label for="appointmentTime">التوقيت المفصل</label>
            <select id="appointmentTime" required>
                <option value="04:00 مساءً">04:00 مساءً</option>
                <option value="04:30 مساءً">04:30 مساءً</option>
                <option value="05:00 مساءً">05:00 مساءً</option>
                <option value="05:30 مساءً">05:30 مساءً</option>
                <option value="06:00 مساءً">06:00 مساءً</option>
                <option value="06:30 مساءً">06:30 مساءً</option>
                <option value="07:00 مساءً">07:00 مساءً</option>
                <option value="07:30 مساءً">07:30 مساءً</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">تأكيد طلب الحجز</button>
    </form>
</div>

<script>
    // المحاكاة البرمجية باستخدام LocalStorage للربط الفوري بين الصفحتين
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('fullName').value;
        const phone = document.getElementById('phoneNumber').value;
        const date = document.getElementById('appointmentDate').value;
        const time = document.getElementById('appointmentTime').value;

        // جلب الإعدادات الحالية للطبيب للتأكد من المواعيد والإجازات
        const settings = JSON.parse(localStorage.getItem('clinic_settings')) || { offDays: [], blockedSlots: [] };
        
        // التحقق من الإجازة والوقت المقفل
        if (settings.offDays.includes(date) || settings.blockedSlots.includes(`${date}T${time}`)) {
            document.getElementById('alertDanger').style.display = 'block';
            document.getElementById('alertSuccess').style.display = 'none';
            return;
        }

        const newAppointment = {
            id: Date.now(),
            name: name,
            phone: phone,
            date: date,
            time: time,
            status: 'مُعلق'
        };

        let appointments = JSON.parse(localStorage.getItem('clinic_appointments')) || [];
        appointments.push(newAppointment);
        localStorage.setItem('clinic_appointments', JSON.stringify(appointments));

        // إطلاق حدث للتحديث الفوري إذا كانت لوحة الدكتور مفتوحة بنفس المتصفح
        localStorage.setItem('new_booking_trigger', Date.now());

        document.getElementById('alertSuccess').style.display = 'block';
        document.getElementById('alertDanger').style.display = 'none';
        document.getElementById('bookingForm').reset();
    });
</script>

</body>
</html>
